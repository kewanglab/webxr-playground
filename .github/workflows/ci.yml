name: CI

# Verification gate for pull requests. This catches the mechanical class of
# failure only — types, bundling, payload size, and the one DOM contract that
# a dependency can silently break. Interaction behaviour in an immersive
# session (turn direction, deadzones, docking snap) is NOT covered here and
# still needs a headset; see docs/pitfalls.md and the agent-harness work in
# docs/phase-1-2-execution-plan.md, which is what eventually makes that layer
# assertable.
#
# Install uses `npm ci`, so a run installs exactly the locked tree and a
# dependency cannot drift in underneath a green check. That needs the
# lockfile to carry the Linux-only optional branch of the graph — the
# `@emnapi/*` entries under `@rolldown/binding-wasm32-wasi` — which it now
# does; see the Pages deploy commit for how they were added without moving
# a single direct dependency.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: neither job writes to the repo.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · build · size · steppers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No .nvmrc or engines field in the repo; pinned to match the version
      # local development runs on. Vite 8 needs >= 20.19 / 22.12 regardless.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Split rather than `npm run build` so a red run names the failing stage.
      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npx vite build

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

      # ~285 MiB of browser payload per job otherwise. Keyed on the lockfile,
      # so a Playwright version change invalidates it.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The stepper contract test: pure DOM assertions, deterministic, and the
      # guard against leva reshaping custom-plugin input on a future bump.
      - name: Stepper contract tests
        run: npx playwright test tests/visual/leva-stepper.spec.ts --project=chromium

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  hosted:
    name: subpath build (Pages parity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds with the deploy base and serves it through `vite preview`, then
      # fails on any 404 or console error. A root-absolute asset path builds and
      # typechecks perfectly and only breaks under the Pages subpath, which is
      # exactly the class of bug nothing else here would catch. Also pins the
      # logger's local-only fallback, which is what every hosted visitor gets.
      - name: Subpath build behaves like Pages
        run: npm run test:hosted

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  smoke:
    name: canvas smoke (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Asserts the four cloud-park lab scenes actually rasterise — a black
      # canvas from a crashed R3F subtree is invisible to tsc and vite. The
      # default-theme cases in this spec are UI captures and assert only that
      # the shell heading renders, so scene coverage is cloud-park only.
      #
      # `continue-on-error` sits on the step, not the job: at job level GitHub
      # reports the whole job as success, so a regression would show a green
      # check and go unnoticed. This way the job stays non-blocking but a
      # failure still annotates the PR.
      - name: Canvas has signal
        id: smoke
        continue-on-error: true
        run: npx playwright test tests/visual/capture.spec.ts --project=chromium

      - name: Flag smoke failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::Canvas smoke failed — a lab may not be rasterising. Download the canvas-captures artifact to see what rendered."

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canvas-captures
          path: |
            docs/mockups/captures/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
